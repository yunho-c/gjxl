name: Rust Bindings

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'rust/**'
      - '.github/actions/setup-native-toolchain/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/publish-rust.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'rust/**'
      - '.github/actions/setup-native-toolchain/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/publish-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} native wrapper
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2022]
    env:
      CMAKE_GENERATOR: Ninja
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: ./.github/actions/setup-native-toolchain

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
