name: Publish Rust Crates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish gjxl 0.0.x
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GJXL_SOURCE_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: brew install cmake ninja

      - name: Publish raw bindings
        run: cargo publish -p gjxl-sys

      - name: Wait for the crates.io index
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              https://crates.io/api/v1/crates/gjxl-sys/0.0.1 >/dev/null; then
              exit 0
            fi
            echo "gjxl-sys 0.0.1 is not visible yet (attempt $attempt/30)"
            sleep 10
          done
          exit 1

      - name: Publish safe wrapper
        run: cargo publish -p gjxl
