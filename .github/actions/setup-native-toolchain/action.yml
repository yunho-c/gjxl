name: Audited native toolchain
description: Select the compiler and standard library covered by the storage contract
runs:
  using: composite
  steps:
    - name: Select Xcode 26.3
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
        export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
        xcodebuild -version
        xcrun clang++ --version
        xcrun --show-sdk-version
        brew install cmake ninja
    - name: Install audited GNU packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --allow-downgrades \
          gcc-13=13.3.0-6ubuntu2~24.04.1 \
          g++-13=13.3.0-6ubuntu2~24.04.1 \
          libstdc++-13-dev=13.3.0-6ubuntu2~24.04.1 \
          libstdc++6=14.2.0-4ubuntu2~24.04.1 \
          cmake ninja-build libclang-dev libjxl-tools
        echo 'CC=gcc-13' >> "$GITHUB_ENV"
        echo 'CXX=g++-13' >> "$GITHUB_ENV"
        g++-13 --version
        dpkg-query -W gcc-13 g++-13 libstdc++-13-dev libstdc++6
    - name: Install and select MSVC 14.37
      if: runner.os == 'Windows'
      shell: pwsh
      run: '& "$env:GITHUB_ACTION_PATH/setup-msvc.ps1"'
